<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comité de Canales — Informes</title>
<link rel="stylesheet" href="hubnav.css">
<style>
:root{--verde:#009C3C;--verde-osc:#00782E;--verde-md:#005A22;--verde-suave:#E7F4EC;--amarillo:#FFD100;
 --bg:#F4F6F5;--bord:#E2E6E3;--txt:#1d2b22;--muted:#5d6b63}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:24px 18px 60px}
.header{background:linear-gradient(135deg,var(--verde),var(--verde-md));color:#fff;border-radius:16px;
 padding:30px 22px;text-align:center;box-shadow:0 8px 24px rgba(0,120,46,.18);margin-top:22px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:700;letter-spacing:.08em}
.eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--amarillo)}
.header h1{margin:14px 0 6px;font-size:30px;font-weight:800}
.header p{margin:0;font-size:14.5px;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:26px}
.card{background:#fff;border:1px solid var(--bord);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;
 box-shadow:0 2px 10px rgba(0,0,0,.04);transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.09)}
.card .ico{font-size:34px;line-height:1}
.card .nombre{font-size:18px;font-weight:800;color:var(--verde-md)}
.card .cta{margin-top:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;
 background:var(--verde);color:#fff;text-decoration:none;font-weight:700;font-size:14px;
 border-radius:10px;padding:10px 16px;transition:background .15s,color .15s}
.card .cta:hover{background:var(--amarillo);color:#00492A}
.card .cta:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
.sin-informes{grid-column:1/-1;text-align:center;color:var(--muted);margin:0}
.footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:34px}
@media(max-width:560px){.wrap{padding:14px 12px 44px}.header{padding:22px 14px}.header h1{font-size:23px}.grid{grid-template-columns:1fr}}
</style></head>
<body data-informe="home">
<div id="hub-nav"></div>
<div class="wrap">
 <div class="header">
  <span class="eyebrow"><span class="dot"></span>COMITÉ DE CANALES</span>
  <h1>Informes de Canales</h1>
  <p>Seguros Bolívar · estado y métricas por canal digital</p>
 </div>
 <div class="grid" id="home-grid"></div>
 <div class="footer">Selecciona un informe para ver su detalle de KPIs, iniciativas y roadmap.</div>
</div>
<script src="informes.js"></script>
<script>
(function(){
 var EMPTY_MESSAGE='Sin informes disponibles por ahora.';
 var ESCAPES={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
 function escapeHtml(v){
  if(v===null||v===undefined)return '';
  return String(v).replace(/[&<>"']/g,function(ch){return ESCAPES[ch];});
 }
 function safeUrl(url){
  var t=(url===null||url===undefined)?'':String(url);
  if(t.replace(/^\s+|\s+$/g,'')==='')return '#';
  return /^[\s\u0000-\u001f]*(javascript|data|vbscript):/i.test(t)?'#':t;
 }
 function renderCard(inf){
  var e=(inf&&typeof inf==='object')?inf:{};
  return '<div class="card"><div class="ico" aria-hidden="true">'+escapeHtml(e.emoji)+'</div>'
   +'<div class="nombre">'+escapeHtml(e.nombre)+'</div>'
   +'<a class="cta" href="'+escapeHtml(safeUrl(e.url))+'">Ver informe \u2192</a></div>';
 }
 function renderCards(lista){
  if(!Array.isArray(lista)||lista.length===0){
   return '<p class="sin-informes">'+EMPTY_MESSAGE+'</p>';
  }
  return lista.map(renderCard).join('');
 }
 var grid=document.getElementById('home-grid');
 if(!grid)return;
 grid.innerHTML=renderCards(window.INFORMES_LIST);
})();
</script>
</body></html>
